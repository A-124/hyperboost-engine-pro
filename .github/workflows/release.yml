name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.1.0 publishes a GitHub Release with the APK
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repo secrets. Without them the APK is signed with the debug key (still installs).
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          # versionCode must always go up so new APKs can update old installs
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore release keystore (if secrets are set)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: falling back to debug signing."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/HyperBoost-Engine-Pro-${VERSION_NAME}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: HyperBoost-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
