name: Release

# Runs for version tags (v1.3.5) or a manual rebuild of an existing tag.
# This is the public repository: the release it publishes is what users download
# and what the in-app updater checks. See RELEASING.md for the required secrets.
# A debug-signed APK is never published from this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild, e.g. v1.3.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate the tag, that it sits on main, and that CHANGELOG has its section.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      signing_ready: ${{ steps.secrets.outputs.signing_ready }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate tag
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$tag' is not valid. Use the form v1.3.5 or v1.3.5-beta.1."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          prerelease="false"
          if [[ "$version" == *-* ]]; then prerelease="true"; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, prerelease=$prerelease)"

      - name: Check signing secrets
        id: secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set."
          fi

      - name: Require signing secrets for a public release
        if: steps.secrets.outputs.signing_ready != 'true'
        shell: bash
        run: |
          echo "::error::Refusing to publish: add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD under Settings → Secrets and variables → Actions. A debug-signed APK cannot update existing installs and must not be published on the public releases page."
          exit 1

      - name: Confirm tag points to a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The tagged commit is not on main. Merge the release to main before tagging."
            exit 1
          fi

      - name: Confirm CHANGELOG has a section for this version
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 == "## " v || index($0, "## " v " ") == 1) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no section headed '## $VERSION' with notes under it."
            exit 1
          fi
          echo "Release notes found:"; cat release_notes.md

  # ---------------------------------------------------------------------------
  # 2. Unit tests, build the APK, and stage it with a checksum.
  # ---------------------------------------------------------------------------
  build:
    name: Build APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.preflight.outputs.version }}
      RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      UNITY_GAME_ID: ${{ vars.UNITY_GAME_ID }}
      UNITY_TEST_MODE: ${{ vars.UNITY_TEST_MODE }}
      UNITY_BANNER_ID: ${{ vars.UNITY_BANNER_ID }}
      UNITY_INTERSTITIAL_ID: ${{ vars.UNITY_INTERSTITIAL_ID }}
      UNITY_REWARDED_ID: ${{ vars.UNITY_REWARDED_ID }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', needs.preflight.outputs.tag) }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: needs.preflight.outputs.signing_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          # Accept pasted secrets that contain whitespace, wrapping quotes or a data-URI prefix.
          cleaned="${KEYSTORE_BASE64//[[:space:]]/}"
          cleaned="${cleaned#\"}"; cleaned="${cleaned%\"}"
          cleaned="${cleaned#\'}"; cleaned="${cleaned%\'}"
          if [[ "$cleaned" == data:* ]]; then cleaned="${cleaned#*,}"; fi
          cleaned="$(printf '%s' "$cleaned" | tr -- '-_' '+/')"
          while (( ${#cleaned} % 4 != 0 )); do cleaned="${cleaned}="; done
          echo "Encoded keystore length: ${#cleaned}"

          if [[ ! "$cleaned" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::KEYSTORE_BASE64 contains characters that are not valid base64."
            exit 1
          fi

          if ! printf '%s' "$cleaned" | base64 --decode > "$keystore" 2>/tmp/keystore-decode.err; then
            echo "::error::KEYSTORE_BASE64 is not valid base64: $(cat /tmp/keystore-decode.err)"
            exit 1
          fi
          if ! test -s "$keystore"; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file. Re-add it as base64 of the .jks file."
            exit 1
          fi

          magic="$(od -An -tx1 -N4 "$keystore" | tr -d ' \n')"
          echo "Decoded keystore size: $(stat -c%s "$keystore") bytes (magic $magic)"
          if [[ "$magic" != "feedfeed" && "$magic" != 3082* ]]; then
            echo "::warning::Decoded keystore does not look like JKS or PKCS12; apksigner will validate it."
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Set version code
        shell: bash
        run: |
          set -euo pipefail
          # Monotonic per workflow run, so every release installs over the previous one.
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n1)"
          if [[ -z "$src" ]]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          mkdir -p dist
          apk="dist/HyperBoost-Engine-Pro-${VERSION_NAME}.apk"
          cp "$src" "$apk"

          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "$apk" | tee signer.txt

          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::Refusing to publish a debug-signed APK. Check the release keystore secrets."
            exit 1
          fi

          fingerprint="$(awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' signer.txt | tr '[:upper:]' '[:lower:]' | tr -d ' :\r\n\t')"
          expected_fingerprint="$(printf '%s' "$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ' :\r\n\t')"
          if [[ "${{ needs.preflight.outputs.signing_ready }}" == "true" && -n "$RELEASE_CERT_SHA256" ]]; then
            if [[ "$fingerprint" != "$expected_fingerprint" ]]; then
              echo "::error::Signing key certificate SHA-256 digest does not match RELEASE_CERT_SHA256."
              exit 1
            fi
            echo "Signing certificate matches the pinned release key."
          fi

          (cd dist && sha256sum "$(basename "$apk")" > SHA256SUMS.txt)
          sha="$(awk '{print $1}' dist/SHA256SUMS.txt)"
          minimum="$(python3 -c "import json; print(json.load(open('update.json'))['minimumSupportedVersion'])")"
          cat > dist/version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apk": "$(basename "$apk")",
            "apkUrl": "https://github.com/A-124/hyperboost-engine-pro/releases/download/v${VERSION_NAME}/$(basename "$apk")",
            "sha256": "${sha}",
            "minimumSupportedVersion": "${minimum}",
            "notes": "",
            "mandatory": false
          }
          EOF
          ls -lh dist
          cat dist/SHA256SUMS.txt
          cat dist/version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperBoost-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Create the public GitHub Release with the signed APK attached.
  #    This release is what users download and the updater checks.
  # ---------------------------------------------------------------------------
  publish:
    name: Create public release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', needs.preflight.outputs.tag) }}
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: HyperBoost-APK
          path: dist

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 == "## " v || index($0, "## " v " ") == 1) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          {
            echo
            echo "---"
            echo "APK and SHA-256 checksum are attached."
          } >> release_notes.md

      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: HyperBoost Engine Pro ${{ needs.preflight.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/HyperBoost-Engine-Pro-*.apk
            dist/SHA256SUMS.txt
            dist/version.json
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
